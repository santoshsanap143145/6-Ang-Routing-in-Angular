

<div class="d-flex flex-column align-items-center">
  <mat-icon
    color="warn"
    class="icon"
    aria-hidden="false"
    aria-label="Example home icon"
    fontIcon="delete"
  ></mat-icon>
  <h1><strong>Are you sure?</strong></h1>
  <h3 class="m-0">{{ msg }}</h3>
  <h3>This process cannot be undone.</h3>
</div>

<div class="d-flex justify-content-around">
  <button (click)="onClose(true)" mat-raised-button class="mr-3" color="warn">
    Confirm
  </button>
  <button (click)="onClose(false)" mat-raised-button color="primary">
    Cancel
  </button>
</div>
